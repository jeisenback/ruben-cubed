<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2x2 Beginner Method</title>
  <link rel="stylesheet" href="src/style.css">
  <!-- Loaded separately so the lessons still work if the cube library fails to load. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/cubing@0.66.1/twisty/+esm"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header>
    <h1>2x2 Beginner Method</h1>
    <nav id="lessons" aria-label="Lessons"></nav>
  </header>
  <main>
    <section class="lesson">
      <p id="step-lesson" class="eyebrow"></p>
      <h2 id="step-title"></h2>
      <p id="step-text"></p>
      <p id="step-alg"></p>
      <div id="choices"></div>
      <div class="controls">
        <button id="back" type="button">Back</button>
        <button id="next" type="button">Next</button>
      </div>
    </section>
    <twisty-player id="cube" puzzle="2x2x2" background="none" control-panel="bottom-row"></twisty-player>
  </main>
</body>
</html>
